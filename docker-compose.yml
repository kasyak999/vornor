volumes:
  db_data:
  data_redis:
services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
  redis:
    build: ./redis/
    restart: always
    ports:
      - "6380:6379"
    command: [
      "redis-server", "/usr/local/etc/redis/redis.conf",
      "--requirepass", "${POSTGRES_PASSWORD}"
    ]
    volumes:
    - data_redis:/data
  backend:
    build: ./src/
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 7000 --proxy-headers"
    depends_on:
      - db
      - redis
    env_file: .env
    ports:
      - "7000:7000"
  celery_worker:
    build: ./src/
    command: celery -A app.core.celery_worker worker --loglevel=info
    depends_on:
      - backend
    env_file:
      - .env
  celery_beat:
    build: ./src/
    command: celery -A app.core.celery_worker beat --loglevel=info
    depends_on:
      - backend
      - celery_worker
    env_file:
      - .env
  flower:
    build: ./src/
    command: >
      sh -c "celery -A app.core.celery_worker flower
      --basic_auth=0:${POSTGRES_PASSWORD}
      --url_prefix=/flower/"
    ports:
      - "5555:5555"
    depends_on:
      - celery_worker
    env_file:
      - .env 
  nginx:
    build: ./nginx/
    depends_on:
      - backend
      - flower
    ports:
      - 8000:80
  bot:
    build: ./bot_telegram/
    command: python -u bot.py
    depends_on:
      - nginx
    env_file:
      - .env